services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trackvault
      POSTGRES_PASSWORD: trackvault
      POSTGRES_DB: trackvault
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackvault"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published to the host — only the app talks to it.

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Every TRACKVAULT_* var in .env reaches the app; the explicit entries below
    # only pin compose-level defaults. New settings need no compose edit.
    env_file:
      - path: .env
        required: false
    environment:
      TRACKVAULT_DATABASE_URL: postgresql+psycopg://trackvault:trackvault@db:5432/trackvault
      TRACKVAULT_ENVIRONMENT: ${TRACKVAULT_ENVIRONMENT:-development}
      TRACKVAULT_SECRET_KEY: ${TRACKVAULT_SECRET_KEY:-dev-insecure-change-me-please-32chars}
      TRACKVAULT_ENCRYPTION_KEY: ${TRACKVAULT_ENCRYPTION_KEY:-}
      TRACKVAULT_BASE_URL: ${TRACKVAULT_BASE_URL:-http://localhost:8000}
      TRACKVAULT_BOOTSTRAP_ADMIN_EMAIL: ${TRACKVAULT_BOOTSTRAP_ADMIN_EMAIL:-admin@trackvault.local}
      TRACKVAULT_BOOTSTRAP_ADMIN_PASSWORD: ${TRACKVAULT_BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe!Admin2026}
      TRACKVAULT_SMTP_HOST: ${TRACKVAULT_SMTP_HOST:-}
      TRACKVAULT_SMTP_PORT: ${TRACKVAULT_SMTP_PORT:-587}
      TRACKVAULT_SMTP_USER: ${TRACKVAULT_SMTP_USER:-}
      TRACKVAULT_SMTP_PASS: ${TRACKVAULT_SMTP_PASS:-}
      TRACKVAULT_SMTP_FROM: ${TRACKVAULT_SMTP_FROM:-info@dedicatusit.com}
      TRACKVAULT_TEST_RECIPIENT: ${TRACKVAULT_TEST_RECIPIENT:-}
      TRACKVAULT_AI_PROVIDER: ${TRACKVAULT_AI_PROVIDER:-ollama}
      TRACKVAULT_AI_BASE_URL: ${TRACKVAULT_AI_BASE_URL:-http://ollama:11434}
      TRACKVAULT_AI_MODEL: ${TRACKVAULT_AI_MODEL:-llama3.2:3b}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # Self-hosted LLM for intelligent import. Data never leaves this stack.
  # Start with:  docker compose --profile ai up -d
  # Then pull a model:  docker compose exec ollama ollama pull llama3.2:3b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  ollama_models:
