{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block body %}
<div style="max-width:440px;margin:20px auto">
  <h1>Change your password</h1>
  <p class="small">Choose a strong password (minimum 12 characters).</p>
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  <div class="card">
    <form method="post" action="/auth/change-password">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Current password</label><input type="password" name="current" required>
      <label>New password</label><input type="password" name="new_password" minlength="12" required>
      <p style="margin-top:16px"><button class="btn" type="submit">Update password</button></p>
    </form>
  </div>
</div>
{% endblock %}
